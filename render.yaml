services:
  - type: web
    name: certdesk
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn certdesk.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /health/
    disk:
      name: certdesk-media
      mountPath: /opt/render/project/src/media
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DEMO_MODE
        value: "False"
      - key: ALLOWED_HOSTS
        syncFrom: RENDER_HOSTNAME
      - key: CSRF_TRUSTED_ORIGINS
        syncFrom: RENDER_EXTERNAL_URL
      - key: BASE_URL
        syncFrom: RENDER_EXTERNAL_URL
      - key: MEDIA_ROOT
        value: /opt/render/project/src/media
      - key: DATABASE_URL
        fromDatabase:
          name: certdesk-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_STARTER_PRICE_ID
        sync: false
      - key: STRIPE_GROWTH_PRICE_ID
        sync: false

databases:
  - name: certdesk-db
    databaseName: certdesk
    user: certdesk
    plan: basic-256mb
