{% extends "base.html" %}
{% block title %}Password changed · CertDesk{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<main id="main-content" class="auth-shell">
  <a class="brand auth-brand" href="{% url 'core:landing' %}"><span class="brand-mark">C</span><span>CertDesk</span></a>
  <div class="auth-card">
    <span class="auth-kicker">PASSWORD CHANGED</span><h1>Your password has been changed</h1>
    <p>You can now sign in with your new password.</p>
    <p class="auth-switch"><a href="{% url 'accounts:login' %}">Sign in</a></p>
  </div>
</main>
{% endblock %}
