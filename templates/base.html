{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CertDesk keeps vendor documents organized, tracks expirations, and sends renewal reminders.">
  <title>{% block title %}CertDesk{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'styles.css' %}">
  <link rel="stylesheet" href="{% static 'marketing.css' %}">
  <link rel="stylesheet" href="{% static 'app.css' %}">
  <link rel="stylesheet" href="{% static 'app-extra.css' %}">
  <link rel="stylesheet" href="{% static 'marketing-extra.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {% if messages %}
    <div class="toast-stack">
      {% for message in messages %}
        <div class="toast toast-{{ message.tags|default:'info' }}"{% if 'error' in message.tags %} role="alert" aria-live="assertive"{% else %} role="status" aria-live="polite"{% endif %}>
          <span class="toast-mark" aria-hidden="true">{% if 'error' in message.tags %}!{% elif 'success' in message.tags %}✓{% else %}i{% endif %}</span>
          <span>{{ message }}</span>
        </div>
      {% endfor %}
    </div>
  {% endif %}
  <div id="ui-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
  {% block content %}{% endblock %}
  <script src="{% static 'app.js' %}" defer></script>
</body>
</html>
